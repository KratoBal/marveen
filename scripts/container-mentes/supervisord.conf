; Marveen — supervisord konfiguráció (a systemd user unitok pótlása)
;
; Megfeleltetés a hivatalos telepítő unitjaihoz:
;   marveen-dashboard.service  ->  [program:dashboard]
;   marveen-channels.service   ->  [program:channels]
;   marveen-morning.timer      ->  cron (/etc/cron.d/marveen, ld. entrypoint.sh)
;
; stopasgroup/killasgroup KIKAPCSOLVA: ez a systemd KillMode=process megfelelője.
; A dashboard tmux sessionöket indít az al-ágenseknek; ha a folyamatcsoportot
; lőnénk le, minden dashboard-újraindítás magával rántaná az összes futó ágenst.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=info

[unix_http_server]
file=/run/supervisor.sock
chmod=0770
chown=root:marveen

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[program:dashboard]
command=/usr/local/bin/run-dashboard.sh
user=marveen
directory=/home/marveen/marveen
autostart=true
autorestart=true
startsecs=10
startretries=1000
stopasgroup=false
killasgroup=false
stopsignal=TERM
stopwaitsecs=20
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=HOME="/home/marveen",USER="marveen",PATH="/home/marveen/.npm-global/bin:/home/marveen/.local/bin:/home/marveen/.bun/bin:/usr/local/bin:/usr/bin:/bin",NODE_ENV="production"
priority=10

[program:channels]
command=/usr/local/bin/run-channels.sh
user=marveen
directory=/home/marveen/marveen
autostart=true
; Restart=always megfelelője: a channels.sh nulla kóddal is kiléphet, és a
; hivatalos unit is feltétel nélkül újraindítja (ld. a script fejlécét).
autorestart=true
startsecs=15
startretries=1000
stopasgroup=false
killasgroup=false
stopsignal=TERM
stopwaitsecs=20
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
environment=HOME="/home/marveen",USER="marveen",PATH="/home/marveen/.npm-global/bin:/home/marveen/.local/bin:/home/marveen/.bun/bin:/usr/local/bin:/usr/bin:/bin"
priority=20

[program:cron]
command=/usr/sbin/cron -f -L 1
user=root
autostart=true
autorestart=true
startsecs=5
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
priority=30
